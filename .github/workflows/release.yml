name: Release

# Runs when a version tag is pushed, for example: git push origin v0.0.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Builds the package on each OS and keeps the files as workflow artifacts.
  build:
    name: Package (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run dist

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  # Creates one draft release with every package, after both builds succeed. Done in its
  # own job so the two builds don't race to create the same release.
  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    # Only this job can write to the repo, and only to create the release.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: packages/*
